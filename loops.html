<script>
  let brands = ["Apple", "Realme", "Oppo", "IQOO"];
  // for of loop Iterates values (literals) from array
  for(let record of brands){
    console.log(record);
    //.write() prints value on screen rather than console
    document.write(`<li>${record}</li>`);
  }
  //for in loop Iterators index number from array
  for(let record of brands){
    console.log(record);
  }
</script>

    interestAmount=Math.round(interestAmount);
    let closingBalance=amount+openingBalance+
    interestAmount;
    document.write(`<li>
            ${i},
            ${openingBalance} ,
            ${amount},
            ${interestAmount},
            ${ClosingBalance}
            </li>`);
    i++;

</script>

<script>
  let brands = ["Apple", "Realme", "Oppo", "IQOO"];
  console.log(brands);
  //add value at end
  brands.push("Xiomi", "Samsung");
  console.log(brands);
  //removes value at start
  brands.unshift("lava", "Nokia");
  console.log(brands);
  //removes value at start
  brands.pop();
  console.log(brands);
  //removs value start
  brands.shift();
  console.log(brands);
  //if value exists returns true if not returns
  console.log(brands.includes("Samsung"));
  console.log(brands.indexOf("Xiomi"));
</script>

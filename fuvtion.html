<script>
  //Named Function
  //"{}" bracket with function are  called functional scope
  function emi(p, r, n) {
    n=n*12;
    r=r/12/100;
    //P x R x (1+R)^N / [(1+R)^N-1] 
    let emivalue=p*r*(1+r)**n/([(1+r)**n-1])
    console.log(emivalue);
    console.log(Math.round(emivalue));
  }
  //Function Call
  emi(2500000, 8, 30);
  emi(500000,2,30);
</script>
